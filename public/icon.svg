<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0a0908" />
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2dac4" />
      <stop offset="35%" stop-color="#c89c6e" />
      <stop offset="70%" stop-color="#9d7348" />
      <stop offset="100%" stop-color="#e8c89b" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="bronzeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#c89c6e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2b251f" stroke-width="4" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="#c89c6e" opacity="0.08" filter="blur(40px)" />

  <!-- Translucent Frosted Glass Card Plate -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#glass)" stroke="url(#bronze)" stroke-width="2.5" />

  <!-- Viewfinder Aspect Ratio Crop Brackets -->
  <path d="M 136 200 L 136 136 L 200 136" fill="none" stroke="url(#bronze)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#bronzeGlow)" />
  <path d="M 376 200 L 376 136 L 312 136" fill="none" stroke="url(#bronze)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#bronzeGlow)" />
  <path d="M 136 312 L 136 376 L 200 376" fill="none" stroke="url(#bronze)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#bronzeGlow)" />
  <path d="M 376 312 L 376 376 L 312 376" fill="none" stroke="url(#bronze)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#bronzeGlow)" />

  <!-- 16:9 Landscape Frame Wireframe -->
  <rect x="160" y="206" width="192" height="100" rx="16" fill="none" stroke="#f5f3ef" stroke-width="8" stroke-dasharray="12 8" opacity="0.4" />

  <!-- 9:16 Vertical Frame Active Focal Frame -->
  <rect x="206" y="160" width="100" height="192" rx="16" fill="none" stroke="url(#bronze)" stroke-width="10" filter="url(#bronzeGlow)" />

  <!-- Center Aperture Pip -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  <circle cx="256" cy="256" r="8" fill="#c89c6e" />
</svg>
