<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">
  <defs>
    <linearGradient id="bronzeLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2dac4" />
      <stop offset="50%" stop-color="#c89c6e" />
      <stop offset="100%" stop-color="#9d7348" />
    </linearGradient>
    <linearGradient id="glassLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c89c6e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Frosted Plate + Crop Bounds) -->
  <g transform="translate(16, 16)">
    <rect width="108" height="108" rx="26" fill="#141210" stroke="#2c2620" stroke-width="2" />
    <rect x="14" y="14" width="80" height="80" rx="18" fill="url(#glassLogo)" stroke="url(#bronzeLogo)" stroke-width="1.5" />
    
    <!-- Framing Brackets -->
    <path d="M 26 44 L 26 26 L 44 26" fill="none" stroke="url(#bronzeLogo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
    <path d="M 82 44 L 82 26 L 64 26" fill="none" stroke="url(#bronzeLogo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
    <path d="M 26 64 L 26 82 L 44 82" fill="none" stroke="url(#bronzeLogo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
    <path d="M 82 64 L 82 82 L 64 82" fill="none" stroke="url(#bronzeLogo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
    
    <!-- Dynamic Vertical Frame -->
    <rect x="42" y="32" width="24" height="44" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
    <circle cx="54" cy="54" r="3" fill="url(#bronzeLogo)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(144, 42)">
    <!-- Primary Title -->
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="800" fill="#f5f3ef" letter-spacing="-0.5px">
      Aspect<tspan fill="url(#bronzeLogo)">Cut</tspan>
    </text>

    <!-- Subtitle: ZenithDistrict Product Line -->
    <g transform="translate(2, 58)">
      <circle cx="3" cy="-3" r="3" fill="#c89c6e" />
      <text x="14" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#a89f91" letter-spacing="2px">
        A PRODUCT OF ZENITHDISTRICT
      </text>
    </g>
  </g>
</svg>
